name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Menor privilegio para el GITHUB_TOKEN
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec exige Dart ^3.10.1, incluido desde Flutter 3.38
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy .env for tests
        run: touch .env && echo "dummy=1" > .env

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
